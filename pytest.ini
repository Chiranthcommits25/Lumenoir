[pytest]
testpaths = tests

# Unit tests must never download model weights or touch the network. Tests that
# use the real LPIPS/NIQE checkpoints are marked "integration" and are excluded
# by default. Run them explicitly with:
#
#   .venv/bin/python -m pytest -m integration -o addopts=""
addopts = -m "not integration"

markers =
    integration: requires pretrained model weights or network access (excluded by default)
