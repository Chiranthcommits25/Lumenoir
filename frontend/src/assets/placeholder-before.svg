<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Placeholder underexposed night scene">
  <defs>
    <linearGradient id="before-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b11"/>
      <stop offset="1" stop-color="#151d27"/>
    </linearGradient>
    <radialGradient id="before-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a173" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c9a173" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="before-street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121821"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#before-sky)"/>

  <!-- distant buildings -->
  <rect x="0" y="300" width="330" height="360" fill="#141b25"/>
  <rect x="300" y="240" width="180" height="420" fill="#101722"/>
  <rect x="720" y="270" width="210" height="390" fill="#121924"/>
  <rect x="900" y="330" width="300" height="330" fill="#0e151f"/>

  <!-- windows -->
  <g fill="#22303f">
    <rect x="40" y="350" width="46" height="58"/>
    <rect x="120" y="350" width="46" height="58"/>
    <rect x="200" y="430" width="46" height="58"/>
    <rect x="330" y="300" width="40" height="52"/>
    <rect x="400" y="300" width="40" height="52"/>
    <rect x="760" y="330" width="44" height="54"/>
    <rect x="850" y="330" width="44" height="54"/>
    <rect x="950" y="390" width="44" height="54"/>
    <rect x="1040" y="390" width="44" height="54"/>
  </g>

  <!-- lamp -->
  <rect x="628" y="330" width="8" height="330" fill="#1b232e"/>
  <circle cx="632" cy="320" r="120" fill="url(#before-lamp)"/>
  <circle cx="632" cy="320" r="16" fill="#b58f63" opacity="0.5"/>

  <rect x="0" y="660" width="1200" height="240" fill="url(#before-street)"/>
  <rect x="560" y="660" width="140" height="240" fill="#0d131b"/>
</svg>
